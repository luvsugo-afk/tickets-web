<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gradient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header class="glass-header">
            <h1>Help Desk</h1>
            <p>Sistema de soporte técnico</p>
        </header>

        <form id="formTicket" class="glass-card">
            <h2>Nuevo ticket</h2>
            
            <div class="form-row">
                <div class="input-group">
                    <label>Nombre</label>
                    <input type="text" id="solicitante" required placeholder="Tu nombre">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
            </div>

            <div class="input-group">
                <label>Categoría</label>
                <select id="categoria" required>
                    <option value="">Seleccionar...</option>
                    <option value="hardware">Hardware</option>
                    <option value="software">Software</option>
                    <option value="red">Red</option>
                    <option value="email">Email</option>
                    <option value="impresion">Impresión</option>
                    <option value="accesos">Accesos</option>
                    <option value="otros">Otros</option>
                </select>
            </div>

            <div class="input-group" id="campo-problema" style="display:none;">
                <label>Problema</label>
                <select id="problema" required>
                    <option value="">Seleccionar...</option>
                </select>
            </div>

            <div class="input-group" id="campo-detalles" style="display:none;">
                <label>Detalles <span class="req">*</span></label>
                <textarea id="detalles" rows="3" required placeholder="Describe el incidente..."></textarea>
            </div>

            <div class="preview-glass" id="vista-previa" style="display:none;">
                <span class="badge" id="tag-prioridad">Media</span>
                <p id="vp-problema-texto">-</p>
            </div>

            <button type="submit" class="btn-glass" id="btn-enviar" disabled>
                Crear ticket →
            </button>
        </form>

        <div class="glass-card success" id="mensaje-exito" style="display:none;">
            <div class="check">✓</div>
            <h3>Ticket creado</h3>
            <p>ID: <strong id="numero-ticket">-</strong></p>
            <p>Prioridad: <strong id="prioridad-confirmada">-</strong></p>
            <button class="btn-glass secondary" onclick="location.reload()">Nuevo</button>
        </div>
    </main>

    <script>
        const API_URL = 'https://tickets-api-63tv.onrender.com';
    </script>
    <script src="app.js"></script>
</body>
</html>
