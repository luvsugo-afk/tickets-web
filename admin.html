<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos adicionales específicos del panel */
        .login-main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin-left: 260px;
        }
        
        .login-box {
            background: var(--surface);
            padding: 48px;
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-box h2 {
            font-family: var(--font-serif);
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .login-box p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        
        .login-box input {
            margin-bottom: 16px;
        }
        
        .login-box button {
            width: 100%;
        }
        
        .error-msg {
            color: #c45c4a;
            font-size: 14px;
            margin-top: 12px;
        }
        
        /* Panel de tickets */
        .tickets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .tickets-title {
            font-family: var(--font-serif);
            font-size: 32px;
        }
        
        .stats-row {
            display: flex;
            gap: 16px;
        }
        
        .stat-box {
            background: #f5f4f2;
            padding: 16px 24px;
            border-radius: 4px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: 600;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Filtros */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 10px 20px;
            font-family: var(--font-sans);
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        /* Lista de tickets */
        .ticket-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid;
            padding: 24px;
            margin-bottom: 16px;
            border-radius: 4px;
        }
        
        .ticket-item.critica { border-left-color: #c45c4a; }
        .ticket-item.alta { border-left-color: #c4a13d; }
        .ticket-item.media { border-left-color: var(--accent); }
        .ticket-item.baja { border-left-color: #8b8b8b; }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .ticket-id {
            font-weight: 600;
            font-size: 16px;
        }
        
        .ticket-meta {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        .ticket-desc {
            background: #f5f4f2;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .ticket-details-extra {
            margin-top: 12px;
            padding: 12px;
            background: #e8f4e8;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .ticket-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }
        
        .btn-resolve {
            background: var(--accent);
            color: white;
            border: none;
        }
        
        .btn-reopen {
            background: #8b8b8b;
            color: white;
            border: none;
        }
        
        .btn-delete {
            background: transparent;
            color: #c45c4a;
            border: 1px solid #c45c4a;
            margin-left: auto;
        }
        
        .btn-delete:hover {
            background: #c45c4a;
            color: white;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }
        
        .closed {
            opacity: 0.7;
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .login-main {
                margin-left: 0;
            }
            
            .tickets-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            
            .ticket-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Sidebar igual que en index.html -->
        <aside class="sidebar">
            <div class="brand">Soporte</div>
            <nav class="nav">
                <a href="index.html" class="nav-item">Nuevo Ticket</a>
                <a href="#" class="nav-item active">Panel Admin</a>
            </nav>
        </aside>
        
        <!-- Login Screen -->
        <main class="main login-main" id="login-screen">
            <div class="login-box">
                <h2>Acceso Administrativo</h2>
                <p>Ingrese su clave de acceso</p>
                <input type="password" id="password" placeholder="Clave de acceso" onkeypress="if(event.key==='Enter')login()">
                <button class="btn-primary" onclick="login()">Ingresar</button>
                <div id="error-msg" class="error-msg"></div>
            </div>
        </main>
        
        <!-- Panel Content -->
        <main class="main" id="panel-content" style="display:none;">
            <div class="tickets-header">
                <h1 class="tickets-title">Gestión de Tickets</h1>
                <div class="stats-row">
                    <div class="stat-box">
                        <div class="stat-number" id="stat-open">0</div>
                        <div class="stat-label">Abiertos</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat-crit">0</div>
                        <div class="stat-label">Críticos</div>
                    </div>
                </div>
            </div>
            
            <div class="filters">
                <button class="filter-btn active" onclick="filter('all', this)">Todos</button>
                <button class="filter-btn" onclick="filter('open', this)">Abiertos</button>
                <button class="filter-btn" onclick="filter('closed', this)">Resueltos</button>
            </div>
            
            <div id="tickets-list">
                <div class="empty-state">Cargando tickets...</div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://tickets-api-63tv.onrender.com';
        let TOKEN = '';
        let ticketsData = [];

        async function login() {
            const pwd = document.getElementById('password').value;
            document.getElementById('error-msg').textContent = '';
            
            if (!pwd) {
                document.getElementById('error-msg').textContent = 'Ingrese su clave';
                return;
            }
            
            TOKEN = pwd;
            
            try {
                const res = await fetch(`${API_URL}/api/admin/tickets`, {
                    headers: { 'x-api-key': TOKEN }
                });
                
                if (res.status === 401) {
                    document.getElementById('error-msg').textContent = 'Clave incorrecta';
                    TOKEN = '';
                    return;
                }
                
                ticketsData = await res.json();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('panel-content').style.display = 'block';
                renderTickets('all');
                updateStats();
                
            } catch (err) {
                document.getElementById('error-msg').textContent = 'Error de conexión';
                TOKEN = '';
            }
        }

        function renderTickets(filter) {
            const container = document.getElementById('tickets-list');
            let list = ticketsData;
            
            if (filter === 'open') list = ticketsData.filter(t => t.estado === 'Abierto');
            if (filter === 'closed') list = ticketsData.filter(t => t.estado === 'Cerrado');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay tickets en esta categoría</div>';
                return;
            }
            
            container.innerHTML = list.map(t => `
                <div class="ticket-item ${t.prioridad.toLowerCase()} ${t.estado === 'Cerrado' ? 'closed' : ''}">
                    <div class="ticket-header">
                        <span class="ticket-id">Ticket #${t.id}: ${esc(t.titulo)}</span>
                        <span class="badge ${t.prioridad.toLowerCase()}">${t.prioridad}</span>
                    </div>
                    <div class="ticket-meta">
                        ${t.email} · ${t.solicitante} · ${new Date(t.fecha_creacion).toLocaleString()} · Estado: ${t.estado}
                    </div>
                    <div class="ticket-desc">${esc(t.descripcion)}</div>
                    ${t.detalles_extra ? `<div class="ticket-details-extra"><strong>Notas adicionales:</strong> ${esc(t.detalles_extra)}</div>` : ''}
                    <div class="ticket-actions">
                        ${t.estado === 'Abierto' 
                            ? `<button class="btn-small btn-resolve" onclick="updateStatus(${t.id}, 'Cerrado')">Marcar Resuelto</button>`
                            : `<button class="btn-small btn-reopen" onclick="updateStatus(${t.id}, 'Abierto')">Reabrir</button>`
                        }
                        <button class="btn-small btn-delete" onclick="deleteTicket(${t.id})">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const open = ticketsData.filter(t => t.estado === 'Abierto').length;
            const crit = ticketsData.filter(t => t.prioridad === 'Critica' && t.estado === 'Abierto').length;
            document.getElementById('stat-open').textContent = open;
            document.getElementById('stat-crit').textContent = crit;
        }

        async function updateStatus(id, status) {
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': TOKEN
                },
                body: JSON.stringify({ estado: status })
            });
            await login();
        }

        async function deleteTicket(id) {
            if (!confirm('¿Eliminar el ticket #' + id + '?')) return;
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'DELETE',
                headers: { 'x-api-key': TOKEN }
            });
            await login();
        }

        function filter(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTickets(type);
        }

        function esc(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Seguridad: pedir clave al volver
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && TOKEN) {
                location.reload();
            }
        });
    </script>
</body>
</html>
