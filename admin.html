<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración — IT Support</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f7;
            --surface: #ffffff;
            --sidebar: #2d4a3e;
            --sidebar-text: #e8e6e3;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --accent: #4a7c59;
            --accent-hover: #3d6548;
            --danger: #c45c4a;
            --warning: #c4a13d;
            --border: #e5e5e5;
            --font-serif: 'DM Serif Display', serif;
            --font-sans: 'Inter', sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        
        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 48px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-box h1 {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 8px;
        }
        
        .login-box p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        
        .login-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            font-family: var(--font-sans);
            font-size: 15px;
        }
        
        .login-box input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .login-box button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .login-box button:hover {
            background: var(--accent-hover);
        }
        
        .error {
            color: var(--danger);
            margin-top: 16px;
            font-size: 14px;
        }
        
        .page {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: var(--sidebar);
            color: var(--sidebar-text);
            padding: 40px 30px;
            position: fixed;
            height: 100vh;
        }
        
        .brand {
            font-family: var(--font-serif);
            font-size: 28px;
            margin-bottom: 60px;
        }
        
        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .nav-item {
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 4px;
            opacity: 0.7;
            transition: all 0.2s;
        }
        
        .nav-item:hover,
        .nav-item.active {
            opacity: 1;
            background: rgba(255,255,255,0.1);
        }
        
        .main {
            flex: 1;
            margin-left: 280px;
            padding: 40px 60px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .header h1 {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 400;
        }
        
        .stats {
            display: flex;
            gap: 24px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-family: var(--font-serif);
            font-size: 36px;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .filter-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font-sans);
            cursor: pointer;
            font-size: 14px;
        }
        
        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .tickets {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .ticket {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid;
            padding: 28px;
        }
        
        .ticket.critica { border-left-color: var(--danger); }
        .ticket.alta { border-left-color: var(--warning); }
        .ticket.media { border-left-color: var(--accent); }
        .ticket.baja { border-left-color: #8b8b8b; }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .ticket-title {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 400;
        }
        
        .ticket-priority {
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #e8e6e3;
        }
        
        .ticket-priority.critica { background: #f5e5e3; color: var(--danger); }
        .ticket-priority.alta { background: #f5f0e3; color: #9a7b18; }
        .ticket-priority.media { background: #e8f0e9; color: var(--accent); }
        
        .ticket-meta {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .ticket-desc {
            background: var(--bg);
            padding: 20px;
            margin-bottom: 16px;
            line-height: 1.7;
        }
        
        .ticket-details {
            margin-top: 16px;
            padding: 16px;
            background: #f5f4f2;
            border-left: 3px solid var(--accent);
        }
        
        .ticket-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            font-family: var(--font-sans);
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn-resolve {
            background: var(--accent);
            color: white;
        }
        
        .btn-resolve:hover {
            background: var(--accent-hover);
        }
        
        .btn-reopen {
            background: #e8e6e3;
            color: var(--text);
        }
        
        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            margin-left: auto;
        }
        
        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }
        
        .empty {
            text-align: center;
            padding: 80px;
            color: var(--text-muted);
        }
        
        .closed {
            opacity: 0.7;
        }
        
        @media (max-width: 900px) {
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
            }
            .main {
                margin-left: 0;
            }
            .page {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="login-screen" id="login">
        <div class="login-box">
            <h1>Administración</h1>
            <p>Panel de gestión de tickets</p>
            <input type="password" id="password" placeholder="Clave de acceso" onkeypress="if(event.key==='Enter')login()">
            <button onclick="login()">Ingresar</button>
            <div id="error" class="error"></div>
        </div>
    </div>

    <div class="page" id="panel" style="display:none;">
        <aside class="sidebar">
            <div class="brand">IT Support</div>
            <nav class="nav">
                <a href="index.html" class="nav-item">Nuevo Ticket</a>
                <a href="#" class="nav-item active">Panel Admin</a>
            </nav>
        </aside>
        
        <main class="main">
            <div class="header">
                <h1>Tickets</h1>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="stat-open">0</div>
                        <div class="stat-label">Abiertos</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-crit">0</div>
                        <div class="stat-label">Críticos</div>
                    </div>
                </div>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="filter('all', this)">Todos</button>
                <button class="filter-btn" onclick="filter('open', this)">Abiertos</button>
                <button class="filter-btn" onclick="filter('closed', this)">Resueltos</button>
            </div>

            <div id="tickets-container" class="tickets">
                <div class="empty">Cargando tickets...</div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://tickets-api-63tv.onrender.com';
        let TOKEN = '';
        let tickets = [];

        async function login() {
            const pwd = document.getElementById('password').value;
            document.getElementById('error').textContent = '';
            
            if (!pwd) return;
            
            TOKEN = pwd;
            
            try {
                const res = await fetch(`${API_URL}/api/admin/tickets`, {
                    headers: { 'x-api-key': TOKEN }
                });
                
                if (res.status === 401) {
                    document.getElementById('error').textContent = 'Clave incorrecta';
                    TOKEN = '';
                    return;
                }
                
                tickets = await res.json();
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').style.display = 'flex';
                render('all');
                updateStats();
                
            } catch (err) {
                document.getElementById('error').textContent = 'Error de conexión';
                TOKEN = '';
            }
        }

        function render(filterType) {
            const container = document.getElementById('tickets-container');
            let list = tickets;
            
            if (filterType === 'open') list = tickets.filter(t => t.estado === 'Abierto');
            if (filterType === 'closed') list = tickets.filter(t => t.estado === 'Cerrado');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty">No hay tickets en esta categoría</div>';
                return;
            }
            
            container.innerHTML = list.map(t => `
                <div class="ticket ${t.prioridad.toLowerCase()} ${t.estado === 'Cerrado' ? 'closed' : ''}">
                    <div class="ticket-header">
                        <div>
                            <div class="ticket-title">#${t.id} — ${esc(t.titulo)}</div>
                        </div>
                        <span class="ticket-priority ${t.prioridad.toLowerCase()}">${t.prioridad}</span>
                    </div>
                    <div class="ticket-meta">
                        ${t.email} · ${t.solicitante} · ${new Date(t.fecha_creacion).toLocaleString()}
                    </div>
                    <div class="ticket-desc">${esc(t.descripcion)}</div>
                    ${t.detalles_extra ? `<div class="ticket-details"><strong>Notas adicionales:</strong> ${esc(t.detalles_extra)}</div>` : ''}
                    <div class="ticket-actions">
                        ${t.estado === 'Abierto' 
                            ? `<button class="btn btn-resolve" onclick="update(${t.id}, 'Cerrado')">Marcar como resuelto</button>`
                            : `<button class="btn btn-reopen" onclick="update(${t.id}, 'Abierto')">Reabrir</button>`
                        }
                        <button class="btn btn-delete" onclick="del(${t.id})">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const open = tickets.filter(t => t.estado === 'Abierto').length;
            const crit = tickets.filter(t => t.prioridad === 'Critica' && t.estado === 'Abierto').length;
            document.getElementById('stat-open').textContent = open;
            document.getElementById('stat-crit').textContent = crit;
        }

        async function update(id, status) {
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': TOKEN
                },
                body: JSON.stringify({ estado: status })
            });
            await login();
        }

        async function del(id) {
            if (!confirm('¿Eliminar ticket #' + id + '?')) return;
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'DELETE',
                headers: { 'x-api-key': TOKEN }
            });
            await login();
        }

        function filter(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(type);
        }

        function esc(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('beforeunload', () => { TOKEN = ''; });
    </script>
</body>
</html>
