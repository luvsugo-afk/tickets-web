<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin // Tickets IT</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --accent: #58a6ff;
            --success: #238636;
            --danger: #da3633;
            --warning: #f0883e;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --font: 'JetBrains Mono', monospace;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            line-height: 1.6;
        }
        
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-box h1 {
            color: var(--accent);
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .login-box h1::before {
            content: "# ";
            color: var(--success);
        }
        
        .login-box p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 24px;
        }
        
        .login-box input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font);
            margin-bottom: 16px;
            border-radius: 3px;
        }
        
        .login-box input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            font-family: var(--font);
            font-weight: 700;
            cursor: pointer;
            border-radius: 3px;
        }
        
        .login-box button:hover {
            background: #79c0ff;
        }
        
        .error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 12px;
        }
        
        .panel {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--accent);
        }
        
        .panel-header h1 {
            color: var(--accent);
            font-size: 20px;
        }
        
        .panel-header h1::before {
            content: "$ ";
            color: var(--success);
        }
        
        .stats {
            display: flex;
            gap: 16px;
        }
        
        .stat {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 12px 20px;
            text-align: center;
        }
        
        .stat-num {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font);
            cursor: pointer;
            font-size: 12px;
        }
        
        .filter-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        
        .tickets-list {
            display: grid;
            gap: 12px;
        }
        
        .ticket {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-left: 3px solid;
            padding: 16px;
        }
        
        .ticket.critica { border-left-color: var(--danger); }
        .ticket.alta { border-left-color: var(--warning); }
        .ticket.media { border-left-color: var(--accent); }
        .ticket.baja { border-left-color: var(--text-muted); }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .ticket-id {
            color: var(--accent);
            font-weight: 700;
        }
        
        .priority {
            font-size: 10px;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 2px;
        }
        
        .priority.critica { background: var(--danger); color: white; }
        .priority.alta { background: var(--warning); color: var(--bg); }
        .priority.media { background: var(--accent); color: var(--bg); }
        .priority.baja { background: var(--text-muted); color: var(--bg); }
        
        .ticket-meta {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 12px;
        }
        
        .ticket-desc {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 12px;
            margin-bottom: 12px;
            font-size: 12px;
            white-space: pre-wrap;
        }
        
        .ticket-details {
            margin-top: 8px;
            padding: 8px;
            background: rgba(88, 166, 255, 0.1);
            border-left: 2px solid var(--accent);
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .ticket-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 6px 12px;
            border: none;
            font-family: var(--font);
            font-size: 11px;
            cursor: pointer;
            border-radius: 2px;
        }
        
        .btn-resolve {
            background: var(--success);
            color: white;
        }
        
        .btn-reopen {
            background: var(--text-muted);
            color: var(--bg);
        }
        
        .btn-delete {
            background: var(--danger);
            color: white;
            margin-left: auto;
        }
        
        .empty {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }
        
        .closed {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="login-screen" id="login">
        <div class="login-box">
            <h1>ADMIN_CONSOLE</h1>
            <p>Sistema de Gestión de Tickets</p>
            <input type="password" id="password" placeholder="Ingresar clave..." onkeypress="if(event.key==='Enter')login()">
            <button onclick="login()">[ ACCEDER ]</button>
            <div id="error" class="error"></div>
        </div>
    </div>

    <div class="panel" id="panel">
        <div class="panel-header">
            <h1>PANEL_ADMIN</h1>
            <div class="stats">
                <div class="stat">
                    <div class="stat-num" id="stat-open">0</div>
                    <div class="stat-label">Abiertos</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="stat-crit">0</div>
                    <div class="stat-label">Críticos</div>
                </div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filter('all', this)">TODOS</button>
            <button class="filter-btn" onclick="filter('open', this)">ABIERTOS</button>
            <button class="filter-btn" onclick="filter('closed', this)">CERRADOS</button>
        </div>

        <div id="tickets-container" class="tickets-list">
            <div class="empty">Cargando...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://tickets-api-63tv.onrender.com';
        let TOKEN = '';
        let tickets = [];

        async function login() {
            const pwd = document.getElementById('password').value;
            document.getElementById('error').textContent = '';
            
            if (!pwd) return;
            
            TOKEN = pwd;
            
            try {
                const res = await fetch(`${API_URL}/api/admin/tickets`, {
                    headers: { 'x-api-key': TOKEN }
                });
                
                if (res.status === 401) {
                    document.getElementById('error').textContent = 'Clave incorrecta';
                    TOKEN = '';
                    return;
                }
                
                tickets = await res.json();
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                render('all');
                updateStats();
                
            } catch (err) {
                document.getElementById('error').textContent = 'Error de conexión';
                TOKEN = '';
            }
        }

        function render(filter) {
            const container = document.getElementById('tickets-container');
            let list = tickets;
            
            if (filter === 'open') list = tickets.filter(t => t.estado === 'Abierto');
            if (filter === 'closed') list = tickets.filter(t => t.estado === 'Cerrado');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty">Sin tickets en esta categoría</div>';
                return;
            }
            
            container.innerHTML = list.map(t => `
                <div class="ticket ${t.prioridad.toLowerCase()} ${t.estado === 'Cerrado' ? 'closed' : ''}">
                    <div class="ticket-header">
                        <span class="ticket-id">#${t.id}: ${esc(t.titulo)}</span>
                        <span class="priority ${t.prioridad.toLowerCase()}">${t.prioridad}</span>
                    </div>
                    <div class="ticket-meta">
                        ${t.email} | ${t.solicitante} | ${new Date(t.fecha_creacion).toLocaleString()}
                    </div>
                    <div class="ticket-desc">${esc(t.descripcion)}</div>
                    ${t.detalles_extra ? `<div class="ticket-details"><strong>Notas:</strong> ${esc(t.detalles_extra)}</div>` : ''}
                    <div class="ticket-actions">
                        ${t.estado === 'Abierto' 
                            ? `<button class="btn btn-resolve" onclick="update(${t.id}, 'Cerrado')">[ RESOLVER ]</button>`
                            : `<button class="btn btn-reopen" onclick="update(${t.id}, 'Abierto')">[ REABRIR ]</button>`
                        }
                        <button class="btn btn-delete" onclick="del(${t.id})">[ ELIMINAR ]</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const open = tickets.filter(t => t.estado === 'Abierto').length;
            const crit = tickets.filter(t => t.prioridad === 'Critica' && t.estado === 'Abierto').length;
            document.getElementById('stat-open').textContent = open;
            document.getElementById('stat-crit').textContent = crit;
        }

        async function update(id, status) {
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': TOKEN
                },
                body: JSON.stringify({ estado: status })
            });
            await login();
        }

        async function del(id) {
            if (!confirm('¿Eliminar ticket #' + id + '?')) return;
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'DELETE',
                headers: { 'x-api-key': TOKEN }
            });
            await login();
        }

        function filter(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(type);
        }

        function esc(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Logout al salir
        window.addEventListener('beforeunload', () => { TOKEN = ''; });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                TOKEN = '';
                location.reload();
            }
        });
    </script>
</body>
</html>
