<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel IT | Gestión de Tickets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
        .login-box h1 { color: #8b5cf6; margin-bottom: 8px; }
        .login-box p { color: #64748b; margin-bottom: 24px; font-size: 0.9rem; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; }
        .login-box button { width: 100%; padding: 12px; background: #8b5cf6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .panel { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #334155; flex-wrap: wrap; gap: 16px; }
        .panel-header h1 { color: #8b5cf6; }
        .stats { display: flex; gap: 16px; }
        .stat-card { background: #1e293b; padding: 16px 24px; border-radius: 12px; text-align: center; }
        .stat-num { font-size: 2rem; font-weight: 700; color: #8b5cf6; }
        .stat-label { font-size: 0.875rem; color: #94a3b8; }
        .filtros { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .filtro-btn { padding: 8px 16px; background: #334155; border: none; color: white; border-radius: 8px; cursor: pointer; }
        .filtro-btn.active { background: #8b5cf6; }
        .tickets-grid { display: grid; gap: 16px; }
        .ticket-card { background: #1e293b; border-radius: 12px; padding: 20px; border-left: 4px solid; }
        .ticket-card.critica { border-left-color: #ef4444; }
        .ticket-card.alta { border-left-color: #f97316; }
        .ticket-card.media { border-left-color: #eab308; }
        .ticket-card.baja { border-left-color: #22c55e; }
        .ticket-header { display: flex; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .ticket-id { color: #8b5cf6; font-weight: 600; }
        .prioridad-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .prioridad-badge.critica { background: #450a0a; color: #fca5a5; }
        .prioridad-badge.alta { background: #431407; color: #fdba74; }
        .prioridad-badge.media { background: #422006; color: #fde047; }
        .prioridad-badge.baja { background: #052e16; color: #86efac; }
        .ticket-meta { color: #94a3b8; font-size: 0.875rem; margin-bottom: 12px; }
        .ticket-desc { color: #e2e8f0; line-height: 1.6; margin-bottom: 16px; padding: 12px; background: #0f172a; border-radius: 8px; white-space: pre-wrap; }
        .ticket-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; }
        .btn-cerrar { background: #059669; color: white; }
        .btn-reabrir { background: #475569; color: white; }
        .btn-borrar { background: #dc2626; color: white; margin-left: auto; }
        .estado-vacio { text-align: center; padding: 60px; color: #64748b; }
        .cerrado { opacity: 0.6; }
    </style>
</head>
<body>
    <div class="login-screen" id="login">
        <div class="login-box">
            <h1>🔐 Acceso IT</h1>
            <p>Panel de gestión de incidencias</p>
            <input type="password" id="password" placeholder="Clave de acceso">
            <button onclick="login()">Entrar al panel</button>
        </div>
    </div>

    <div class="panel" id="panel">
        <div class="panel-header">
            <div>
                <h1>Panel de Control IT</h1>
                <p style="color: #64748b; margin-top: 4px;">Gestión de incidencias y solicitudes</p>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-num" id="stat-abiertos">0</div>
                    <div class="stat-label">Abiertos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num" id="stat-criticos">0</div>
                    <div class="stat-label">Críticos</div>
                </div>
            </div>
        </div>

        <div class="filtros">
            <button class="filtro-btn active" onclick="filtrar('todos', this)">Todos</button>
            <button class="filtro-btn" onclick="filtrar('Abierto', this)">Abiertos</button>
            <button class="filtro-btn" onclick="filtrar('Cerrado', this)">Resueltos</button>
        </div>

        <div id="tickets-container" class="tickets-grid">
            <div class="estado-vacio">Cargando tickets...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://tickets-api.onrender.com';
        let IT_TOKEN = '';
        let ticketsData = [];

        function login() {
            const pass = document.getElementById('password').value;
            if (!pass) return alert('Ingresa la clave');
            IT_TOKEN = pass;
            document.getElementById('login').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
            cargarTickets();
        }

        async function cargarTickets() {
            try {
                const res = await fetch(`${API_URL}/api/admin/tickets`, {
                    headers: { 'x-api-key': IT_TOKEN }
                });
                
                if (!res.ok) throw new Error('No autorizado');
                
                ticketsData = await res.json();
                mostrarTickets('todos');
                actualizarStats();
            } catch (err) {
                document.getElementById('tickets-container').innerHTML = 
                    '<div class="estado-vacio">Error de autenticación. Verifica tu clave.</div>';
            }
        }

        function mostrarTickets(filtro) {
            const container = document.getElementById('tickets-container');
            let tickets = ticketsData;
            
            if (filtro !== 'todos') {
                tickets = tickets.filter(t => t.estado === filtro);
            }
            
            if (tickets.length === 0) {
                container.innerHTML = '<div class="estado-vacio">No hay tickets en esta categoría</div>';
                return;
            }
            
            container.innerHTML = tickets.map(t => `
                <div class="ticket-card ${t.prioridad.toLowerCase()} ${t.estado === 'Cerrado' ? 'cerrado' : ''}">
                    <div class="ticket-header">
                        <span class="ticket-id">#${t.id}: ${esc(t.titulo)}</span>
                        <span class="prioridad-badge ${t.prioridad.toLowerCase()}">${t.prioridad}</span>
                    </div>
                    <div class="ticket-meta">
                        📧 ${esc(t.email)} | 👤 ${esc(t.solicitante)} | 📅 ${new Date(t.fecha_creacion).toLocaleString()} | Estado: ${t.estado}
                    </div>
                    <div class="ticket-desc">${esc(t.descripcion)}</div>
                    <div class="ticket-actions">
                        ${t.estado === 'Abierto' 
                            ? `<button class="btn btn-cerrar" onclick="cambiarEstado(${t.id}, 'Cerrado')">✓ Marcar resuelto</button>`
                            : `<button class="btn btn-reabrir" onclick="cambiarEstado(${t.id}, 'Abierto')">↻ Reabrir</button>`
                        }
                        <button class="btn btn-borrar" onclick="borrar(${t.id})">🗑 Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function actualizarStats() {
            const abiertos = ticketsData.filter(t => t.estado === 'Abierto').length;
            const criticos = ticketsData.filter(t => t.prioridad === 'Critica' && t.estado === 'Abierto').length;
            document.getElementById('stat-abiertos').textContent = abiertos;
            document.getElementById('stat-criticos').textContent = criticos;
        }

        async function cambiarEstado(id, estado) {
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': IT_TOKEN
                },
                body: JSON.stringify({ estado })
            });
            cargarTickets();
        }

        async function borrar(id) {
            if (!confirm('¿Eliminar este ticket permanentemente?')) return;
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'DELETE',
                headers: { 'x-api-key': IT_TOKEN }
            });
            cargarTickets();
        }

        function filtrar(tipo, btn) {
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            mostrarTickets(tipo);
        }

        function esc(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        setInterval(() => { if (IT_TOKEN) cargarTickets(); }, 30000);
    </script>
</body>
</html>
