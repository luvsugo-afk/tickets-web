<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>// ADMIN_PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
    --bg: #FAF7FC;           /* Lila casi blanco */
    --surface: #FFFFFF;       /* Blanco */
    --sidebar: #E8E0F5;     /* Lavanda claro */
    --sidebar-text: #000000;  /* NEGRO */
    --text: #000000;          /* NEGRO puro */
    --text-muted: #4A4A4A;    /* Gris oscuro, casi negro */
    --accent: #8B5CF6;        /* Violeta */
    --accent-hover: #7C3AED;  /* Violeta más oscuro */
    --border: #DDD6FE;        /* Lavanda borde */
    --shadow: rgba(139, 92, 246, 0.1);
    --font-serif: 'DM Serif Display', serif;
    --font-sans: 'Inter', sans-serif;
}
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
        }
        
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        
        .login-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 48px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-box h1 {
            font-size: 20px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .login-box h1::before {
            content: '◈';
            color: var(--accent);
        }
        
        .login-box p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 32px;
        }
        
        .login-box input {
            width: 100%;
            padding: 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font);
            margin-bottom: 16px;
            font-size: 14px;
        }
        
        .login-box input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .login-box button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            font-family: var(--font);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        
        .login-box button:hover {
            opacity: 0.9;
        }
        
        .error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
        }
        
        .panel {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .panel-header h1 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .panel-header h1::before {
            content: '$';
            color: var(--accent);
            font-family: var(--font-mono);
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .stats {
            display: flex;
            gap: 16px;
        }
        
        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 16px 24px;
            text-align: center;
            min-width: 100px;
        }
        
        .stat-value {
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font);
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .filter-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        
        .btn-link {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 20px;
            font-family: var(--font);
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-link:hover {
            background: rgba(20, 184, 166, 0.1);
        }
        
        .tickets {
            display: grid;
            gap: 16px;
        }
        
        .ticket {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid;
            padding: 20px;
        }
        
        .ticket.critica { border-left-color: var(--danger); }
        .ticket.alta { border-left-color: var(--warning); }
        .ticket.media { border-left-color: var(--accent); }
        .ticket.baja { border-left-color: var(--text-muted); }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .ticket-id {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--accent);
        }
        
        .ticket-priority {
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(20, 184, 166, 0.1);
            color: var(--accent);
        }
        
        .ticket-priority.critica { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .ticket-priority.alta { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        
        .ticket-meta {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 12px;
            font-family: var(--font-mono);
        }
        
        .ticket-desc {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 16px;
            margin-bottom: 12px;
            font-size: 13px;
            white-space: pre-wrap;
        }
        
        .ticket-details {
            margin-top: 12px;
            padding: 12px;
            background: rgba(20, 184, 166, 0.05);
            border-left: 2px solid var(--accent);
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .ticket-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            font-family: var(--font);
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-resolve {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        
        .btn-reopen {
            background: var(--border);
            color: var(--text);
        }
        
        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            margin-left: auto;
        }
        
        .btn:hover {
            opacity: 0.8;
        }
        
        .empty {
            text-align: center;
            padding: 64px;
            color: var(--text-muted);
        }
        
        .closed {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="login-screen" id="login">
        <div class="login-box">
            <h1>ADMIN_PANEL</h1>
            <p>Gestión de tickets de soporte</p>
            <input type="password" id="password" placeholder="Ingresar clave de acceso" onkeypress="if(event.key==='Enter')login()">
            <button onclick="login()">ACCEDER</button>
            <div id="error" class="error"></div>
        </div>
    </div>

    <div class="panel" id="panel">
        <div class="panel-header">
            <h1>TICKETS_SYSTEM</h1>
            <div class="header-actions">
                <a href="index.html" class="btn-link">← Nuevo Ticket</a>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="stat-open">0</div>
                        <div class="stat-label">Abiertos</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="stat-crit">0</div>
                        <div class="stat-label">Críticos</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filter('all', this)">Todos</button>
            <button class="filter-btn" onclick="filter('open', this)">Abiertos</button>
            <button class="filter-btn" onclick="filter('closed', this)">Cerrados</button>
        </div>

        <div id="tickets-container" class="tickets">
            <div class="empty">Cargando tickets...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://tickets-api-63tv.onrender.com';
        let TOKEN = '';
        let tickets = [];

        async function login() {
            const pwd = document.getElementById('password').value;
            document.getElementById('error').textContent = '';
            
            if (!pwd) return;
            
            TOKEN = pwd;
            
            try {
                const res = await fetch(`${API_URL}/api/admin/tickets`, {
                    headers: { 'x-api-key': TOKEN }
                });
                
                if (res.status === 401) {
                    document.getElementById('error').textContent = 'Clave incorrecta';
                    TOKEN = '';
                    return;
                }
                
                tickets = await res.json();
                document.getElementById('login').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                render('all');
                updateStats();
                
            } catch (err) {
                document.getElementById('error').textContent = 'Error de conexión';
                TOKEN = '';
            }
        }

        function render(filterType) {
            const container = document.getElementById('tickets-container');
            let list = tickets;
            
            if (filterType === 'open') list = tickets.filter(t => t.estado === 'Abierto');
            if (filterType === 'closed') list = tickets.filter(t => t.estado === 'Cerrado');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty">Sin tickets en esta categoría</div>';
                return;
            }
            
            container.innerHTML = list.map(t => `
                <div class="ticket ${t.prioridad.toLowerCase()} ${t.estado === 'Cerrado' ? 'closed' : ''}">
                    <div class="ticket-header">
                        <span class="ticket-id">#${t.id} · ${esc(t.titulo)}</span>
                        <span class="ticket-priority ${t.prioridad.toLowerCase()}">${t.prioridad}</span>
                    </div>
                    <div class="ticket-meta">
                        ${t.email} · ${t.solicitante} · ${new Date(t.fecha_creacion).toLocaleString()}
                    </div>
                    <div class="ticket-desc">${esc(t.descripcion)}</div>
                    ${t.detalles_extra ? `<div class="ticket-details"><strong>Notas:</strong> ${esc(t.detalles_extra)}</div>` : ''}
                    <div class="ticket-actions">
                        ${t.estado === 'Abierto' 
                            ? `<button class="btn btn-resolve" onclick="update(${t.id}, 'Cerrado')">Resolver</button>`
                            : `<button class="btn btn-reopen" onclick="update(${t.id}, 'Abierto')">Reabrir</button>`
                        }
                        <button class="btn btn-delete" onclick="del(${t.id})">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const open = tickets.filter(t => t.estado === 'Abierto').length;
            const crit = tickets.filter(t => t.prioridad === 'Critica' && t.estado === 'Abierto').length;
            document.getElementById('stat-open').textContent = open;
            document.getElementById('stat-crit').textContent = crit;
        }

        async function update(id, status) {
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': TOKEN
                },
                body: JSON.stringify({ estado: status })
            });
            await login();
        }

        async function del(id) {
            if (!confirm('¿Eliminar ticket #' + id + '?')) return;
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'DELETE',
                headers: { 'x-api-key': TOKEN }
            });
            await login();
        }

        function filter(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(type);
        }

        function esc(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('beforeunload', () => { TOKEN = ''; });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                TOKEN = '';
                location.reload();
            }
        });
    </script>
</body>
</html>
