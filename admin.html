<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin/title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos adicionales específicos del admin */
        .login-layout {
            display: flex;
            min-height: 100vh;
        }
        
        .login-sidebar {
            width: 260px;
            background: var(--sidebar);
            color: var(--sidebar-text);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
        }
        
        .login-sidebar .brand {
            font-family: var(--font-serif);
            font-size: 28px;
            margin-bottom: 40px;
        }
        
        .back-link {
            margin-top: auto;
            color: var(--sidebar-text);
            text-decoration: none;
            opacity: 0.7;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        
        .back-link:hover {
            opacity: 1;
        }
        
        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
        }
        
        .login-card {
            width: 100%;
            max-width: 400px;
        }
        
        .login-card h1 {
            font-family: var(--font-serif);
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .login-card p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        
        .login-field {
            margin-bottom: 20px;
        }
        
        .login-field label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .login-field input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: var(--font-sans);
            font-size: 15px;
        }
        
        .login-field input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .btn-login {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
        }
        
        .btn-login:hover {
            background: var(--accent-hover);
        }
        
        .error-message {
            color: #c45c4a;
            font-size: 14px;
            margin-top: 16px;
        }
        
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }
        
        .admin-sidebar {
            width: 260px;
            background: var(--sidebar);
            color: var(--sidebar-text);
            padding: 40px 30px;
            position: fixed;
            height: 100vh;
        }
        
        .admin-sidebar .brand {
            font-family: var(--font-serif);
            font-size: 28px;
            margin-bottom: 60px;
        }
        
        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .admin-nav a {
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 6px;
            opacity: 0.7;
            transition: all 0.2s;
        }
        
        .admin-nav a:hover,
        .admin-nav a.active {
            opacity: 1;
            background: rgba(255,255,255,0.1);
        }
        
        .admin-main {
            flex: 1;
            margin-left: 260px;
            padding: 60px;
        }
        
        .admin-header {
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .admin-header h1 {
            font-family: var(--font-serif);
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px 28px;
            min-width: 140px;
        }
        
        .stat-number {
            font-family: var(--font-serif);
            font-size: 36px;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .filter-btn {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .tickets-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .ticket-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid;
            padding: 24px;
        }
        
        .ticket-item.critica { border-left-color: #c45c4a; }
        .ticket-item.alta { border-left-color: #c4a13d; }
        .ticket-item.media { border-left-color: var(--accent); }
        .ticket-item.baja { border-left-color: #8b8b8b; }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .ticket-id {
            font-weight: 600;
            font-size: 16px;
        }
        
        .ticket-priority {
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 4px;
            background: #e8e6e3;
        }
        
        .ticket-meta {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .ticket-desc {
            background: var(--bg);
            padding: 16px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .ticket-notes {
            margin-top: 12px;
            padding: 12px 16px;
            background: #f5f4f2;
            border-left: 3px solid var(--accent);
            font-size: 14px;
            color: var(--text-muted);
        }
        
        .ticket-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .btn-action {
            padding: 10px 20px;
            font-family: var(--font-sans);
            font-size: 13px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .btn-resolve {
            background: var(--accent);
            color: white;
        }
        
        .btn-reopen {
            background: var(--border);
            color: var(--text);
        }
        
        .btn-delete {
            background: transparent;
            color: #c45c4a;
            border: 1px solid #c45c4a;
            margin-left: auto;
        }
        
        .btn-delete:hover {
            background: #c45c4a;
            color: white;
        }
        
        .empty-state {
            text-align: center;
            padding: 80px;
            color: var(--text-muted);
        }
        
        .closed {
            opacity: 0.6;
        }
        
        @media (max-width: 900px) {
            .admin-sidebar {
                width: 100%;
                position: relative;
                height: auto;
            }
            .admin-main {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div id="login-screen" class="login-layout">
        <aside class="login-sidebar">
            <div class="brand">IT Support</div>
            <a href="index.html" class="back-link">← Volver al formulario</a>
        </aside>
        
        <main class="login-main">
            <div class="login-card">
                <h1>Acceso Administrativo</h1>
                <p>Ingrese su clave de acceso para gestionar tickets</p>
                
                <div class="login-field">
                    <label>Clave de acceso</label>
                    <input type="password" id="password" placeholder="••••••••" onkeypress="if(event.key==='Enter')login()">
                </div>
                
                <button class="btn-login" onclick="login()">Ingresar</button>
                <div id="error-msg" class="error-message"></div>
            </div>
        </main>
    </div>

    <div id="admin-panel" class="admin-layout" style="display:none;">
        <aside class="admin-sidebar">
            <div class="brand">Soporte</div>
            <nav class="admin-nav">
                <a href="index.html">Nuevo Ticket</a>
                <a href="#" class="active">Panel Admin</a>
            </nav>
        </aside>
        
        <main class="admin-main">
            <div class="admin-header">
                <h1>Gestión de Tickets</h1>
                <p class="subtitle">Panel administrativo de soporte técnico</p>
            </div>
            
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-number" id="stat-open">0</div>
                    <div class="stat-label">Abiertos</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="stat-crit">0</div>
                    <div class="stat-label">Críticos</div>
                </div>
            </div>
            
            <div class="filters">
                <button class="filter-btn active" onclick="filter('all', this)">Todos</button>
                <button class="filter-btn" onclick="filter('open', this)">Abiertos</button>
                <button class="filter-btn" onclick="filter('closed', this)">Resueltos</button>
            </div>
            
            <div id="tickets-container" class="tickets-list">
                <div class="empty-state">Cargando tickets...</div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = 'https://tickets-api-63tv.onrender.com';
        let TOKEN = '';
        let tickets = [];

        async function login() {
            const pwd = document.getElementById('password').value;
            document.getElementById('error-msg').textContent = '';
            
            if (!pwd) return;
            
            TOKEN = pwd;
            
            try {
                const res = await fetch(`${API_URL}/api/admin/tickets`, {
                    headers: { 'x-api-key': TOKEN }
                });
                
                if (res.status === 401) {
                    document.getElementById('error-msg').textContent = 'Clave incorrecta';
                    TOKEN = '';
                    return;
                }
                
                tickets = await res.json();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'flex';
                render('all');
                updateStats();
                
            } catch (err) {
                document.getElementById('error-msg').textContent = 'Error de conexión';
                TOKEN = '';
            }
        }

        function render(filterType) {
            const container = document.getElementById('tickets-container');
            let list = tickets;
            
            if (filterType === 'open') list = tickets.filter(t => t.estado === 'Abierto');
            if (filterType === 'closed') list = tickets.filter(t => t.estado === 'Cerrado');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay tickets en esta categoría</div>';
                return;
            }
            
            container.innerHTML = list.map(t => `
                <div class="ticket-item ${t.prioridad.toLowerCase()} ${t.estado === 'Cerrado' ? 'closed' : ''}">
                    <div class="ticket-header">
                        <span class="ticket-id">#${t.id} — ${esc(t.titulo)}</span>
                        <span class="ticket-priority">${t.prioridad}</span>
                    </div>
                    <div class="ticket-meta">
                        ${t.email} · ${t.solicitante} · ${new Date(t.fecha_creacion).toLocaleString()}
                    </div>
                    <div class="ticket-desc">${esc(t.descripcion)}</div>
                    ${t.detalles_extra ? `<div class="ticket-notes"><strong>Notas:</strong> ${esc(t.detalles_extra)}</div>` : ''}
                    <div class="ticket-actions">
                        ${t.estado === 'Abierto' 
                            ? `<button class="btn-action btn-resolve" onclick="update(${t.id}, 'Cerrado')">Marcar resuelto</button>`
                            : `<button class="btn-action btn-reopen" onclick="update(${t.id}, 'Abierto')">Reabrir</button>`
                        }
                        <button class="btn-action btn-delete" onclick="del(${t.id})">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const open = tickets.filter(t => t.estado === 'Abierto').length;
            const crit = tickets.filter(t => t.prioridad === 'Critica' && t.estado === 'Abierto').length;
            document.getElementById('stat-open').textContent = open;
            document.getElementById('stat-crit').textContent = crit;
        }

        async function update(id, status) {
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': TOKEN
                },
                body: JSON.stringify({ estado: status })
            });
            await login();
        }

        async function del(id) {
            if (!confirm('¿Eliminar ticket #' + id + '?')) return;
            await fetch(`${API_URL}/api/admin/tickets/${id}`, {
                method: 'DELETE',
                headers: { 'x-api-key': TOKEN }
            });
            await login();
        }

        function filter(type, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(type);
        }

        function esc(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('beforeunload', () => { TOKEN = ''; });
    </script>
</body>
</html>
